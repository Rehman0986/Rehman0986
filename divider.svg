<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="img" aria-label="Animated blue purple teal gradient divider">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#2dd4bf"><animate attributeName="offset" values="100%;80%;100%" dur="4s" repeatCount="indefinite"/></stop></linearGradient></defs>
  <rect x="0" y="4" width="1200" height="3" rx="1.5" fill="#334155" opacity=".55"/>
  <rect x="0" y="4" width="1200" height="3" rx="1.5" fill="url(#g)"><animate attributeName="opacity" values=".65;1;.65" dur="3s" repeatCount="indefinite"/></rect>
</svg>