<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Career timeline: BS Computer Science at University of Sahiwal from 2021 to 2025, followed by Python Internship at IT Virtual House from February to April 2026">
