  <rect width="1000" height="190" rx="18" fill="#111827"/>
  <path d="M64 55 H936" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 55 H936" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-dasharray="872" stroke-dashoffset="872"><animate attributeName="stroke-dashoffset" from="872" to="0" dur="2s" fill="freeze"/></path>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
